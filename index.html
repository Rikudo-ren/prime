<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数感覚ジェネレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- KaTeX for math rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    
    <!-- Google Fonts: Noto Serif JP for elegant Japanese typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Noto Serif JP', serif; 
            background-color: #fcfcfc;
            color: #2c2c2c;
            -webkit-font-smoothing: antialiased;
            letter-spacing: 0.03em;
        }
        
        .minimal-input {
            background-color: transparent;
            border: none;
            border-bottom: 1px solid #e0e0e0;
            border-radius: 0;
            transition: border-color 0.3s ease;
        }
        .minimal-input:focus {
            border-bottom-color: #2c2c2c;
            outline: none;
            box-shadow: none;
        }

        .minimal-button {
            background-color: #2c2c2c;
            color: #ffffff;
            transition: background-color 0.3s ease;
            letter-spacing: 0.1em;
        }
        .minimal-button:hover {
            background-color: #4a4a4a;
        }

        .outline-button {
            background-color: transparent;
            border: 1px solid #e0e0e0;
            color: #2c2c2c;
            transition: all 0.3s ease;
            letter-spacing: 0.1em;
        }
        .outline-button:hover {
            border-color: #2c2c2c;
            background-color: #fafafa;
        }

        .mode-tab {
            border-bottom: 2px solid;
            cursor: pointer;
        }

        #factorResult { min-height: 4rem; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .answer-container .katex { font-size: 1.6rem !important; }
        .fs-answer-container .katex { font-size: 1em !important; }
        
        ::placeholder {
            color: #b0b0b0;
            font-weight: 300;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center justify-center">
    <!-- Fullscreen Overlay -->
    <div id="fullscreenOverlay" class="hidden fixed inset-0 bg-[#fcfcfc] z-50 flex flex-col items-center justify-center animate-in fade-in duration-300">
        <div id="fullscreenNumber" class="font-light tracking-tighter text-[#2c2c2c] leading-none break-all px-8 text-center transition-all duration-500">0</div>
        <div id="fullscreenAnswer" class="hidden mt-12 text-[#2c2c2c] opacity-0 transition-opacity duration-700 fs-answer-container text-center" style="font-size: 3vw;"></div>
        <div class="absolute bottom-10 text-[#888888] text-xs tracking-widest flex gap-8">
            <span>[Space] 閉じる</span>
            <span>[Enter] 正解を表示</span>
        </div>
    </div>

    <div class="w-full max-w-3xl space-y-10 my-auto">
        <!-- Header -->
        <header class="text-center space-y-3">
            <h1 class="text-3xl md:text-4xl font-medium tracking-widest text-[#2c2c2c]">数感覚ジェネレーター</h1>
            <p class="text-[#888888] text-xs tracking-[0.2em]">暗算トレーニング・出題ツール</p>
        </header>

        <!-- GM Scoreboard Card -->
        <div class="bg-white p-3 md:p-4 shadow-sm border border-[#f0f0f0] space-y-3">
            <div class="flex items-center justify-between border-b border-[#f0f0f0] pb-2">
                <div class="flex items-center gap-2">
                    <span class="text-[11px] font-semibold text-[#2c2c2c] tracking-wider">🏆 スコアボード (GM)</span>
                    <span id="undoIndicator" class="hidden text-[9px] text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-200">Undo完了</span>
                </div>
                <div class="flex items-center gap-3">
                    <button id="toggleScoreboardBtn" onclick="toggleScoreboardFold()" class="text-[10px] text-[#888888] hover:text-[#2c2c2c] transition-colors">
                        折りたたむ
                    </button>
                </div>
            </div>

            <div id="scoreboardContent" class="space-y-3 transition-all">
                <!-- Scoreboard Controls -->
                <div class="flex flex-wrap items-center justify-between gap-2 bg-[#fafafa] p-2 rounded border border-[#f0f0f0]">
                    <div class="flex items-center gap-2">
                        <label class="text-[10px] font-medium text-[#666666] tracking-wider">人数:</label>
                        <select id="playerCountSelect" onchange="changePlayerCount(this.value)" class="pb-0.5 minimal-input text-center text-xs font-medium cursor-pointer">
                            <option value="1">1 人</option>
                            <option value="2" selected>2 人</option>
                            <option value="3">3 人</option>
                            <option value="4">4 人</option>
                            <option value="5">5 人</option>
                            <option value="6">6 人</option>
                            <option value="7">7 人</option>
                            <option value="8">8 人</option>
                            <option value="9">9 人</option>
                            <option value="10">10 人</option>
                        </select>
                    </div>

                    <div class="flex items-center gap-1.5">
                        <button id="undoScoreBtn" onclick="undoScoreAction()" disabled class="px-2 py-1 text-[11px] border border-[#e0e0e0] bg-white text-[#2c2c2c] rounded opacity-40 cursor-not-allowed hover:bg-gray-50 flex items-center gap-1 transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
                            元に戻す <span class="text-[9px] text-[#aaa] font-mono">(Ctrl+Z)</span>
                        </button>
                        <button onclick="resetAllScores()" class="px-2 py-1 text-[11px] border border-[#ffe0e0] bg-white text-[#d32f2f] hover:bg-[#fff5f5] rounded transition-all">
                            リセット
                        </button>
                    </div>
                </div>

                <!-- Players Cards Grid -->
                <div id="playersGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-2">
                    <!-- Dynamic player items generated via JS -->
                </div>
            </div>
        </div>

        <!-- Settings Card -->
        <div class="bg-white p-6 md:p-10 shadow-sm border border-[#f0f0f0] space-y-8">
            
            <!-- Tabs (簡単順) -->
            <div class="flex flex-wrap justify-center gap-x-6 gap-y-4 border-b border-[#f0f0f0] pb-2" id="tabs-container">
                <button id="tab-addsub" class="mode-tab active text-[#2c2c2c] border-[#2c2c2c] pb-2 text-[11px] md:text-xs font-medium tracking-widest transition-all" onclick="setMode('addsub')">足し算・引き算</button>
                <button id="tab-muldiv" class="mode-tab text-[#888888] border-transparent pb-2 text-[11px] md:text-xs font-medium tracking-widest transition-all hover:text-[#2c2c2c]" onclick="setMode('muldiv')">掛け算・割り算</button>
                <button id="tab-make10" class="mode-tab text-[#888888] border-transparent pb-2 text-[11px] md:text-xs font-medium tracking-widest transition-all hover:text-[#2c2c2c]" onclick="setMode('make10')">メイク10</button>
                <button id="tab-sqrt" class="mode-tab text-[#888888] border-transparent pb-2 text-[11px] md:text-xs font-medium tracking-widest transition-all hover:text-[#2c2c2c]" onclick="setMode('sqrt')">平方根の簡略化</button>
                <button id="tab-factor" class="mode-tab text-[#888888] border-transparent pb-2 text-[11px] md:text-xs font-medium tracking-widest transition-all hover:text-[#2c2c2c]" onclick="setMode('factor')">素因数分解</button>
                <button id="tab-polynomial" class="mode-tab text-[#888888] border-transparent pb-2 text-[11px] md:text-xs font-medium tracking-widest transition-all hover:text-[#2c2c2c]" onclick="setMode('polynomial')">多次方程式</button>
            </div>

            <!-- 足し算・引き算 Settings -->
            <div id="addsubSettings" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-3">
                    <label class="block text-[10px] font-medium text-[#888888] tracking-widest text-center">演算の種類</label>
                    <select id="addsubType" class="w-full pb-2 minimal-input appearance-none text-center text-base cursor-pointer">
                        <option value="add" selected>足し算 (+)</option>
                        <option value="sub">引き算 (-)</option>
                        <option value="mix">ランダム (+ / -)</option>
                    </select>
                </div>
                <div class="space-y-3">
                    <label class="block text-[10px] font-medium text-[#888888] tracking-widest text-center">項数 (2〜10)</label>
                    <select id="addsubTerms" class="w-full pb-2 minimal-input appearance-none text-center text-base cursor-pointer" onchange="renderDigitsInputs('addsub')">
                        <option value="2" selected>2 項</option>
                        <option value="3">3 項</option>
                        <option value="4">4 項</option>
                        <option value="5">5 項</option>
                        <option value="6">6 項</option>
                        <option value="7">7 項</option>
                        <option value="8">8 項</option>
                        <option value="9">9 項</option>
                        <option value="10">10 項</option>
                    </select>
                </div>

                <div class="md:col-span-2 space-y-3 border-t border-[#f8f8f8] pt-4">
                    <div class="flex items-center justify-between">
                        <label class="block text-[10px] font-medium text-[#888888] tracking-widest">各項の桁数指定 (1〜10桁)</label>
                        <div class="flex gap-2 items-center text-xs">
                            <span class="text-[10px] text-[#aaa]">一括設定:</span>
                            <button type="button" onclick="setAllDigits('addsub', 1)" class="px-2 py-0.5 text-[10px] border border-[#e0e0e0] hover:border-[#2c2c2c]">全1桁</button>
                            <button type="button" onclick="setAllDigits('addsub', 2)" class="px-2 py-0.5 text-[10px] border border-[#e0e0e0] hover:border-[#2c2c2c]">全2桁</button>
                            <button type="button" onclick="setAllDigits('addsub', 3)" class="px-2 py-0.5 text-[10px] border border-[#e0e0e0] hover:border-[#2c2c2c]">全3桁</button>
                        </div>
                    </div>
                    <div id="addsubDigitsContainer" class="flex flex-wrap gap-3 justify-center pt-2"></div>
                </div>

                <div class="md:col-span-2 text-center pt-2">
                    <label class="inline-flex items-center cursor-pointer text-xs text-[#888888] tracking-wider">
                        <input type="checkbox" id="allowNegative" class="sr-only peer">
                        <div class="relative w-8 h-4 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-[#2c2c2c]"></div>
                        <span class="ms-3 select-none">引き算で負の数を許容する</span>
                    </label>
                </div>
            </div>

            <!-- 掛け算・割り算 Settings -->
            <div id="muldivSettings" class="hidden grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-3">
                    <label class="block text-[10px] font-medium text-[#888888] tracking-widest text-center">演算の種類</label>
                    <select id="muldivType" class="w-full pb-2 minimal-input appearance-none text-center text-base cursor-pointer">
                        <option value="mul" selected>掛け算 (×)</option>
                        <option value="div">割り算 (÷)</option>
                        <option value="mix">ランダム (× / ÷)</option>
                    </select>
                </div>
                <div class="space-y-3">
                    <label class="block text-[10px] font-medium text-[#888888] tracking-widest text-center">項数 (2〜10)</label>
                    <select id="muldivTerms" class="w-full pb-2 minimal-input appearance-none text-center text-base cursor-pointer" onchange="renderDigitsInputs('muldiv')">
                        <option value="2" selected>2 項</option>
                        <option value="3">3 項</option>
                        <option value="4">4 項</option>
                        <option value="5">5 項</option>
                        <option value="6">6 項</option>
                        <option value="7">7 項</option>
                        <option value="8">8 項</option>
                        <option value="9">9 項</option>
                        <option value="10">10 項</option>
                    </select>
                </div>

                <div class="md:col-span-2 space-y-3 border-t border-[#f8f8f8] pt-4">
                    <div class="flex items-center justify-between">
                        <label class="block text-[10px] font-medium text-[#888888] tracking-widest">各項の桁数指定 (1〜10桁)</label>
                        <div class="flex gap-2 items-center text-xs">
                            <span class="text-[10px] text-[#aaa]">一括設定:</span>
                            <button type="button" onclick="setAllDigits('muldiv', 1)" class="px-2 py-0.5 text-[10px] border border-[#e0e0e0] hover:border-[#2c2c2c]">全1桁</button>
                            <button type="button" onclick="setAllDigits('muldiv', 2)" class="px-2 py-0.5 text-[10px] border border-[#e0e0e0] hover:border-[#2c2c2c]">全2桁</button>
                            <button type="button" onclick="setAllDigits('muldiv', 3)" class="px-2 py-0.5 text-[10px] border border-[#e0e0e0] hover:border-[#2c2c2c]">全3桁</button>
                        </div>
                    </div>
                    <div id="muldivDigitsContainer" class="flex flex-wrap gap-3 justify-center pt-2"></div>
                </div>
            </div>

            <!-- メイク10 Settings -->
            <div id="make10Settings" class="hidden grid-cols-1 md:grid-cols-3 gap-6">
                <div class="space-y-3">
                    <label class="block text-[10px] font-medium text-[#888888] tracking-widest text-center">数字の上限</label>
                    <select id="make10MaxNum" class="w-full pb-2 minimal-input appearance-none text-center text-base cursor-pointer">
                        <option value="9" selected>9 以下 (1〜9)</option>
                        <option value="13">13 以下 (トランプ)</option>
                        <option value="20">20 以下</option>
                        <option value="30">30 以下</option>
                    </select>
                </div>
                <div class="space-y-3">
                    <label class="block text-[10px] font-medium text-[#888888] tracking-widest text-center">数字の個数</label>
                    <select id="make10Count" class="w-full pb-2 minimal-input appearance-none text-center text-base cursor-pointer">
                        <option value="3">3 個</option>
                        <option value="4" selected>4 個 (標準)</option>
                        <option value="5">5 個</option>
                    </select>
                </div>
                <div class="space-y-3">
                    <label class="block text-[10px] font-medium text-[#888888] tracking-widest text-center">目標の数 (Target)</label>
                    <input type="number" id="make10Target" value="10" min="1" max="100" class="w-full pb-2 minimal-input text-center text-base">
                </div>
                <div class="md:col-span-3">
                    <p class="text-center text-[10px] text-[#888888]">※ 四則演算(＋, −, ×, ÷)で目標数を作れる組み合わせのみを出題し、重複のない解答例を表示します</p>
                </div>
            </div>

            <!-- 素因数分解 Settings -->
            <div id="factorSettings" class="hidden grid-cols-1 md:grid-cols-3 gap-6">
                <div class="space-y-3">
                    <label class="block text-[10px] font-medium text-[#888888] tracking-widest text-center">桁数 (1-12)</label>
                    <input type="number" id="digits" min="1" max="12" placeholder="指定しない" class="w-full pb-2 minimal-input text-center text-base">
                </div>
                <div class="space-y-3">
                    <label class="block text-[10px] font-medium text-[#888888] tracking-widest text-center">素因数の数</label>
                    <input type="number" id="factorCount" min="1" placeholder="指定しない" class="w-full pb-2 minimal-input text-center text-base">
                </div>
                <div class="space-y-3">
                    <label class="block text-[10px] font-medium text-[#888888] tracking-widest text-center">素因数の上限 (2〜293)</label>
                    <select id="maxPrime" class="w-full pb-2 minimal-input appearance-none text-center text-base cursor-pointer">
                    </select>
                </div>
            </div>

            <!-- 平方根の簡略化 Settings -->
            <div id="sqrtSettings" class="hidden grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-3">
                    <label class="block text-[10px] font-medium text-[#888888] tracking-widest text-center">外に出る数の上限</label>
                    <select id="maxSqrtA" class="w-full pb-2 minimal-input appearance-none text-center text-base cursor-pointer">
                        <option value="5">5 以下</option>
                        <option value="10" selected>10 以下</option>
                        <option value="20">20 以下</option>
                    </select>
                </div>
                <div class="space-y-3">
                    <label class="block text-[10px] font-medium text-[#888888] tracking-widest text-center">ルート内の上限</label>
                    <select id="maxSqrtB" class="w-full pb-2 minimal-input appearance-none text-center text-base cursor-pointer">
                        <option value="10">10 以下</option>
                        <option value="20" selected>20 以下</option>
                        <option value="50">50 以下</option>
                    </select>
                </div>
            </div>

            <!-- 多次方程式 Settings -->
            <div id="polynomialSettings" class="hidden grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-3">
                    <label class="block text-[10px] font-medium text-[#888888] tracking-widest text-center">方程式の次数</label>
                    <select id="polyDegree" class="w-full pb-2 minimal-input appearance-none text-center text-base cursor-pointer">
                        <option value="2">2次方程式</option>
                        <option value="3" selected>3次方程式</option>
                        <option value="4">4次方程式</option>
                        <option value="5">5次方程式</option>
                    </select>
                </div>
                <div class="space-y-3">
                    <label class="block text-[10px] font-medium text-[#888888] tracking-widest text-center">解の絶対値の上限</label>
                    <select id="maxPolyRoot" class="w-full pb-2 minimal-input appearance-none text-center text-base cursor-pointer">
                        <option value="3">3 以下 (初級)</option>
                        <option value="5" selected>5 以下 (中級)</option>
                        <option value="10">10 以下 (上級)</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <p class="text-center text-[10px] text-[#888888]">※ 因数定理などを使い、暗算で解をすべて見つけ出します</p>
                </div>
            </div>

            <button onclick="generateQuestion()" class="w-full minimal-button py-4 text-sm flex items-center justify-center gap-3 mt-4">
                問題を作成する
            </button>
        </div>

        <!-- Error Area -->
        <div id="errorMessage" class="hidden bg-[#fff5f5] border border-[#ffe0e0] text-[#d32f2f] p-5 text-center text-sm tracking-wide leading-relaxed"></div>

        <!-- Result Area -->
        <div id="resultArea" class="hidden bg-white p-8 md:p-12 shadow-sm border border-[#f0f0f0] text-center space-y-10 animate-in fade-in zoom-in duration-500">
            <div class="space-y-4">
                <span class="inline-block text-xs font-medium text-[#888888] tracking-[0.2em] relative after:content-[''] after:block after:w-4 after:h-[1px] after:bg-[#e0e0e0] after:mx-auto after:mt-3">出題</span>
                <div id="targetNumber" class="text-5xl md:text-7xl font-light tracking-tight text-[#2c2c2c] break-all pt-2 leading-tight py-4">0</div>
            </div>

            <div class="flex flex-wrap justify-center gap-4">
                <button id="ttsButton" onclick="speakNumber()" class="outline-button px-6 py-3 text-xs flex items-center gap-3 rounded-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                    音声を再生
                </button>
                <button onclick="toggleFullscreen()" class="outline-button px-6 py-3 text-xs flex items-center gap-3 rounded-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                    全画面表示
                </button>
            </div>

            <div class="pt-8">
                <p class="text-[10px] md:text-xs font-medium text-[#888888] tracking-[0.2em] mb-6 relative after:content-[''] after:block after:w-4 after:h-[1px] after:bg-[#e0e0e0] after:mx-auto after:mt-3">解答例</p>
                <div id="factorResult" class="text-[#2c2c2c] answer-container flex flex-col items-center gap-4"></div>
            </div>
        </div>
    </div>

    <script>
        const MODES = ['addsub', 'muldiv', 'make10', 'sqrt', 'factor', 'polynomial'];
        let currentMode = 'addsub'; 
        
        let currentTargetRaw = "";
        let currentTargetLatex = "";
        let currentAnswerLatex = "";
        let currentReadAloudText = "";

        // --- スコアボード (GMツール) 関連状態 ---
        let playerScores = [
            { name: "Player 1", score: 0 },
            { name: "Player 2", score: 0 }
        ];
        let scoreHistory = []; // Undo用の履歴スタック
        let isScoreboardFolded = false;

        // 素数配列
        const primes = [];

        // --- スコアボード処理 ---
        function renderScoreboard() {
            const grid = document.getElementById('playersGrid');
            if (!grid) return;
            grid.innerHTML = '';

            playerScores.forEach((p, index) => {
                const card = document.createElement('div');
                card.className = "p-2 border border-[#eee] rounded bg-white flex flex-col justify-between space-y-1.5 relative hover:border-[#ccc] transition-all shadow-sm";

                card.innerHTML = `
                    <div class="flex items-center justify-between border-b border-[#f5f5f5] pb-1 gap-1">
                        <input type="text" value="${escapeHtml(p.name)}" 
                               onchange="updatePlayerName(${index}, this.value)"
                               class="text-[11px] font-semibold text-[#2c2c2c] bg-transparent border-b border-transparent hover:border-[#ccc] focus:border-[#2c2c2c] focus:outline-none w-full truncate" 
                               title="名前を変更">
                        <span class="text-[9px] text-[#aaa] shrink-0">P${index + 1}</span>

        function sieve(max) {
            const isPrime = new Array(max + 1).fill(true);
            isPrime[0] = isPrime[1] = false;
            for (let i = 2; i * i <= max; i++) {
                if (isPrime[i]) {
                    for (let j = i * i; j <= max; j += i) isPrime[j] = false;
                }
            }
            for (let i = 2; i <= max; i++) {
                if (isPrime[i]) primes.push(i);
            }
        }

        // --- 足し算・引き算 ---
        function generateAddSubQuestion() {
            const typeSelect = document.getElementById('addsubType').value;
            const terms = parseInt(document.getElementById('addsubTerms').value) || 2;
            const allowNegative = document.getElementById('allowNegative').checked;

            let digitsList = [];
            for (let i = 0; i < terms; i++) {
                const input = document.getElementById(`addsubDigit_${i}`);
                digitsList.push(Math.max(1, Math.min(10, parseInt(input ? input.value : 2) || 2)));
            }

            let numbers = [];
            let ops = [];

            const min1 = Math.pow(10, digitsList[0] - 1);
            const max1 = Math.pow(10, digitsList[0]) - 1;
            numbers.push(getRandomInt(min1, max1));
            let runningTotal = numbers[0];

            for (let i = 1; i < terms; i++) {
                let isAdd = true;
                if (typeSelect === 'sub') {
                    isAdd = false;
                } else if (typeSelect === 'add') {
                    isAdd = true;
                } else {
                    isAdd = Math.random() < 0.5;
                }

                const minN = Math.pow(10, digitsList[i] - 1);
                const maxN = Math.pow(10, digitsList[i]) - 1;
                let num = getRandomInt(minN, maxN);

                if (!isAdd && !allowNegative) {
                    if (runningTotal - num < 0) {
                        if (typeSelect === 'mix') {
                            isAdd = true;
                        } else {
                            if (runningTotal <= minN) {
                                isAdd = true; 
                            } else {
                                num = getRandomInt(minN, Math.min(maxN, runningTotal));
                            }
                        }
                    }
                }

                ops.push(isAdd ? '+' : '-');
                numbers.push(num);
                runningTotal = isAdd ? (runningTotal + num) : (runningTotal - num);
            }

            let rawStr = numbers[0].toString();
            let latexStr = numbers[0].toString();
            let readStr = numbers[0].toString();

            for (let i = 0; i < ops.length; i++) {
                const op = ops[i];
                const num = numbers[i + 1];
                const opRead = op === '+' ? 'たす' : 'ひく';
                rawStr += ` ${op} ${num}`;
                latexStr += ` ${op} ${num}`;
                readStr += ` ${opRead} ${num}`;
            }

            currentTargetRaw = rawStr;
            currentTargetLatex = latexStr;
            currentAnswerLatex = `${runningTotal}`;
            currentReadAloudText = `問題。${readStr}。`;

            renderDisplay();
        }

        // --- 掛け算・割り算 ---
        function generateMulDivQuestion() {
            const type = document.getElementById('muldivType').value;
            const terms = parseInt(document.getElementById('muldivTerms').value) || 2;

            let digitsList = [];
            for (let i = 0; i < terms; i++) {
                const input = document.getElementById(`muldivDigit_${i}`);
                digitsList.push(Math.max(1, Math.min(10, parseInt(input ? input.value : 1) || 1)));
            }

            let ops = [];
            for (let i = 1; i < terms; i++) {
                if (type === 'mul') ops.push('×');
                else if (type === 'div') ops.push('÷');
                else ops.push(Math.random() < 0.5 ? '×' : '÷');
            }

            let numbers = new Array(terms);
            let P_div = 1;
            for (let i = 1; i < terms; i++) {
                const d = digitsList[i];
                const minVal = d === 1 ? 2 : Math.pow(10, d - 1);
                const maxVal = Math.pow(10, d) - 1;

                if (ops[i - 1] === '÷') {
                    numbers[i] = getRandomInt(minVal, maxVal);
                    P_div *= numbers[i];
                } else {
                    numbers[i] = getRandomInt(minVal, maxVal);
                }
            }

            const d1 = digitsList[0];
            const min1 = Math.pow(10, d1 - 1);
            const max1 = Math.pow(10, d1) - 1;

            if (P_div > max1) {
                showError(`割り算の除数の積が大きすぎるため、第1項（${d1}桁）の中に収まりません。桁数を見直してください。`);
                return;
            }

            let kMin = Math.max(1, Math.ceil(min1 / P_div));
            let kMax = Math.floor(max1 / P_div);

            if (kMin > kMax) {
                showError("指定された桁数の組み合わせで整数解の問題を生成できませんでした。桁数を見直してください。");
                return;
            }

            let K = getRandomInt(kMin, kMax);
            numbers[0] = P_div * K;

            let runningVal = numbers[0];
            for (let i = 1; i < terms; i++) {
                if (ops[i - 1] === '×') {
                    runningVal = runningVal * numbers[i];
                } else {
                    runningVal = runningVal / numbers[i];
                }
            }

            const ans = runningVal;

            let rawStr = numbers[0].toString();
            let latexStr = numbers[0].toString();
            let readStr = numbers[0].toString();

            for (let i = 0; i < ops.length; i++) {
                const op = ops[i];
                const num = numbers[i + 1];
                const latexOp = op === '×' ? '\\times' : '\\div';
                const opRead = op === '×' ? 'かける' : 'わる';
                rawStr += ` ${op} ${num}`;
                latexStr += ` ${latexOp} ${num}`;
                readStr += ` ${opRead} ${num}`;
            }

            currentTargetRaw = rawStr;
            currentTargetLatex = latexStr;
            currentAnswerLatex = `${ans}`;
            currentReadAloudText = `問題。${readStr}。`;

            renderDisplay();
        }

        // --- AST (抽象構文木) ベースの Make 10 Solver ---
        function createNumNode(val) {
            return { type: 'num', val: val };
        }

        function createOpNode(op, left, right, val) {
            return { type: 'op', op: op, left: left, right: right, val: val };
        }

        // 優先順位に基いた綺麗なLaTeX文字列への変換（不要な括弧の自動削減）
        function astToLatex(node, parentOp = null, isRight = false) {
            if (node.type === 'num') {
                return node.val.toString();
            }

            const prec = { '+': 1, '-': 1, '*': 2, '/': 2 };
            const myPrec = prec[node.op];
            const parentPrec = parentOp ? prec[parentOp] : 0;

            let needParen = false;

            if (parentOp) {
                if (myPrec < parentPrec) {
                    // 親の優先度が高い場合（例：(1 + 2) * 3）
                    needParen = true;
                } else if (myPrec === parentPrec) {
                    // 優先度が等しく、非可換演算の右側の場合（例：1 - (2 + 3), 1 / (2 * 3)）
                    if (isRight && (parentOp === '-' || parentOp === '/')) {
                        needParen = true;
                    }
                }
            }

            const leftStr = astToLatex(node.left, node.op, false);
            const rightStr = astToLatex(node.right, node.op, true);

            let opSymbol = node.op;
            if (node.op === '*') opSymbol = '\\times';
            if (node.op === '/') opSymbol = '\\div';

            const expr = `${leftStr} ${opSymbol} ${rightStr}`;
            return needParen ? `(${expr})` : expr;
        }

        // 代数的同値性を判定するキャノニカル（標準形）キーの生成
        function getCanonicalKey(node) {
            if (node.type === 'num') {
                return node.val.toString();
            }

            // 可換演算 (+ , *) の場合は左右の子のキーを取得して昇順ソート（過度なフラット化を防ぐ）
            if (node.op === '+' || node.op === '*') {
                const terms = [];
                function collectTerms(currNode, op) {
                    if (currNode.type === 'op' && currNode.op === op) {
                        collectTerms(currNode.left, op);
                        collectTerms(currNode.right, op);
                    } else {
                        terms.push(getCanonicalKey(currNode));
                    }
                }
                collectTerms(node, node.op);
                terms.sort();
                return `(${node.op}:${terms.join(',')})`;
            }

            // 非可換演算 (- , /) は構造の差異（アプローチの違い）を正しく保持
            if (node.op === '-' || node.op === '/') {
                const leftKey = getCanonicalKey(node.left);
                const rightKey = getCanonicalKey(node.right);
                return `(${node.op}:${leftKey},${rightKey})`;
            }

            return '';
        }

        function solveMake10(nums, target) {
            const resultsMap = new Map(); // canonKey -> latexExpr
            const EPS = 1e-7;

            function helper(items) {
                if (items.length === 1) {
                    if (Math.abs(items[0].val - target) < EPS) {
                        const canon = getCanonicalKey(items[0]);
                        if (!resultsMap.has(canon)) {
                            const latex = astToLatex(items[0]);
                            resultsMap.set(canon, latex);
                        }
                    }
                    return;
                }

                for (let i = 0; i < items.length; i++) {
                    for (let j = 0; j < items.length; j++) {
                        if (i === j) continue;

                        const nextItems = items.filter((_, idx) => idx !== i && idx !== j);
                        const a = items[i];
                        const b = items[j];

                        // 1. 足し算 (a + b)
                        helper([...nextItems, createOpNode('+', a, b, a.val + b.val)]);

                        // 2. 引き算 (a - b) : 途中で負の数になる計算 (a < b) は不自然なため除外し、カッコ内が正になる式のみにする
                        if (a.val >= b.val - EPS) {
                            helper([...nextItems, createOpNode('-', a, b, a.val - b.val)]);
                        }

                        // 3. 掛け算 (a * b)
                        helper([...nextItems, createOpNode('*', a, b, a.val * b.val)]);

                        // 4. 割り算 (a / b)
                        if (Math.abs(b.val) > EPS) {
                            helper([...nextItems, createOpNode('/', a, b, a.val / b.val)]);
                        }
                    }
                }
            }

            const initialItems = nums.map(n => createNumNode(n));
            helper(initialItems);

            return Array.from(resultsMap.values());
        }

        function generateMake10Question() {
            const maxNum = parseInt(document.getElementById('make10MaxNum').value) || 9;
            const count = parseInt(document.getElementById('make10Count').value) || 4;
            const target = parseInt(document.getElementById('make10Target').value) || 10;

            let nums = [];
            let solutions = [];
            let attempts = 0;

            while (attempts < 2000) {
                attempts++;
                nums = [];
                for (let i = 0; i < count; i++) {
                    nums.push(getRandomInt(1, maxNum));
                }

                solutions = solveMake10(nums, target);
                if (solutions.length > 0) break;
            }

            if (solutions.length === 0) {
                showError("設定した条件で作成可能な数字の組み合わせが見つかりませんでした。条件をゆるめてみてください。");
                return;
            }

            nums.sort((a, b) => a - b);
            
            currentTargetRaw = nums.join(', ');
            currentTargetLatex = nums.join(',\\ ');
            
            const maxDisplaySolutions = Math.min(solutions.length, 5);
            const displaySols = solutions.slice(0, maxDisplaySolutions);
            
            const latexRows = displaySols.map(s => `${s} &= ${target}`);
            if (latexRows.length > 1) {
                currentAnswerLatex = `\\begin{aligned} ${latexRows.join(' \\\\[0.6em] ')} \\end{aligned}`;
            } else {
                currentAnswerLatex = `${displaySols[0]} = ${target}`;
            }
            
            if (target === 10) {
                currentReadAloudText = `問題。${nums.join('、')}。`;
            } else {
                currentReadAloudText = `問題。${nums.join('、')}を使って${target}を作ってください。`;
            }

            renderDisplay();
        }

        // --- 多次方程式 ---
        function generatePolynomialQuestion() {
            const degree = parseInt(document.getElementById('polyDegree').value);
            const maxRoot = parseInt(document.getElementById('maxPolyRoot').value);
            
            let roots = [];
            for (let i = 0; i < degree; i++) {
                let r = getRandomInt(-maxRoot, maxRoot);
                if (r === 0 && roots.includes(0)) {
                    r = getRandomInt(1, maxRoot);
                    if (Math.random() < 0.5) r = -r;
                }
                roots.push(r);
            }

            let coeffs = [1];
            for (let r of roots) {
                let nextCoeffs = new Array(coeffs.length + 1).fill(0);
                for (let i = 0; i < coeffs.length; i++) {
                    nextCoeffs[i] += coeffs[i];
                    nextCoeffs[i+1] -= r * coeffs[i];
                }
                coeffs = nextCoeffs;
            }

            let latexStr = "";
            let rawStr = "";
            let readAloud = "";
            const n = coeffs.length - 1;

            for (let i = 0; i <= n; i++) {
                let c = coeffs[i];
                if (c === 0) continue;
                
                let signLatex = c > 0 ? "+" : "-";
                let signRaw = c > 0 ? "+" : "-";
                if (i === 0 && c > 0) {
                    signLatex = "";
                    signRaw = "";
                }
                
                if (i > 0) {
                    readAloud += c > 0 ? " たす " : " ひく ";
                } else if (c < 0) {
                    readAloud += "マイナス ";
                }
                
                let absC = Math.abs(c);
                let termLatex = "";
                let termRaw = "";
                let power = n - i;
                
                if (power === 0) {
                    termLatex = `${absC}`;
                    termRaw = `${absC}`;
                    readAloud += `${absC}`;
                } else if (power === 1) {
                    termLatex = absC === 1 ? "x" : `${absC}x`;
                    termRaw = absC === 1 ? "x" : `${absC}x`;
                    readAloud += absC === 1 ? "エックス" : `${absC}エックス`;
                } else {
                    termLatex = absC === 1 ? `x^${power}` : `${absC}x^${power}`;
                    
                    const supMap = {'2': '²', '3': '³', '4': '⁴', '5': '⁵'};
                    const supPower = supMap[power.toString()] || `^${power}`;
                    termRaw = absC === 1 ? `x${supPower}` : `${absC}x${supPower}`;
                    
                    readAloud += absC === 1 ? `エックスの${power}乗` : `${absC}エックスの${power}乗`;
                }
                
                latexStr += `${signLatex}${termLatex}`;
                if(i !== 0 || signRaw === "-") {
                    rawStr += ` ${signRaw} ${termRaw}`;
                } else {
                    rawStr += `${termRaw}`;
                }
            }

            currentTargetRaw = `${rawStr.trim()} = 0`;
            currentTargetLatex = `${latexStr} = 0`;
            
            const uniqueRoots = [...new Set(roots)].sort((a, b) => a - b);
            currentAnswerLatex = `x = ${uniqueRoots.join(',\\ ')}`;
            
            currentReadAloudText = `問題。${readAloud} イコール ゼロ。`;
            
            renderDisplay();
        }

        // --- 平方根 ---
        function generateSqrtQuestion() {
            const maxA = parseInt(document.getElementById('maxSqrtA').value);
            const maxB = parseInt(document.getElementById('maxSqrtB').value);

            const availableB = [];
            for(let i = 2; i <= maxB; i++) {
                if(isSquareFree(i)) availableB.push(i);
            }
            if(availableB.length === 0) availableB.push(2);

            const a = Math.floor(Math.random() * (maxA - 1)) + 2; 
            const b = availableB[Math.floor(Math.random() * availableB.length)];

            const N = a * a * b;

            currentTargetRaw = `√${N}`;
            currentTargetLatex = `\\sqrt{${N}}`;
            currentAnswerLatex = `${a}\\sqrt{${b}}`;
            currentReadAloudText = `問題。ルート${N}。`;
            
            renderDisplay();
        }

        // --- 素因数分解 ---
        function generateFactorQuestion() {
            const digitsRaw = document.getElementById('digits').value;
            const countRaw = document.getElementById('factorCount').value;
            const maxPrimeValue = parseInt(document.getElementById('maxPrime').value);

            const digitInput = digitsRaw ? parseInt(digitsRaw) : null;
            const factorInput = countRaw ? parseInt(countRaw) : null;

            const filteredPrimes = primes.filter(p => p <= maxPrimeValue);
            let resultFactors = [];

            if (!digitInput && !factorInput) {
                const count = 2 + Math.floor(Math.random() * 4); 
                for (let i = 0; i < count; i++) {
                    resultFactors.push(filteredPrimes[Math.floor(Math.random() * filteredPrimes.length)]);
                }
            } 
            else if (!digitInput && factorInput) {
                for (let i = 0; i < factorInput; i++) {
                    resultFactors.push(filteredPrimes[Math.floor(Math.random() * filteredPrimes.length)]);
                }
            } 
            else if (digitInput && !factorInput) {
                let found = false;
                const minVal = Math.pow(10, digitInput - 1);
                const maxVal = Math.pow(10, digitInput) - 1;

                for (let attempt = 0; attempt < 2000; attempt++) {
                    let temp = [];
                    let prod = 1;
                    while (prod <= maxVal) {
                        let p = filteredPrimes[Math.floor(Math.random() * filteredPrimes.length)];
                        temp.push(p);
                        prod *= p;
                        if (prod >= minVal && prod <= maxVal) {
                            if (temp.length >= 2) { 
                                resultFactors = temp;
                                found = true;
                                break;
                            }
                        }
                    }
                    if (found) break;
                }
                if (!found) {
                    showError(`${digitInput}桁になる組み合わせが見つかりませんでした。素因数の上限を広げてみてください。`);
                    return;
                }
            } 
            else {
                const absoluteMin = Math.pow(filteredPrimes[0], factorInput);
                const absoluteMax = Math.pow(filteredPrimes[filteredPrimes.length - 1], factorInput);

                if (absoluteMin >= Math.pow(10, digitInput)) {
                    showError(`【作成不可】素因数 ${factorInput} 個の場合、最低でも ${absoluteMin.toString().length} 桁になります。`);
                    return;
                }
                if (absoluteMax < Math.pow(10, digitInput - 1)) {
                    showError(`【作成不可】素因数 ${factorInput} 個（上限 ${maxPrimeValue}）の場合、最大でも ${absoluteMax.toString().length} 桁にしかなりません。`);
                    return;
                }

                let found = false;
                for (let attempt = 0; attempt < 3000; attempt++) {
                    let temp = [];
                    let prod = 1;
                    for(let i=0; i<factorInput; i++){
                        const p = filteredPrimes[Math.floor(Math.random() * filteredPrimes.length)];
                        temp.push(p);
                        prod *= p;
                    }
                    if(prod.toString().length === digitInput) {
                        resultFactors = temp;
                        found = true;
                        break;
                    }
                }
                if (!found) {
                    showError(`条件（${digitInput}桁、素因数${factorInput}個）を満たす組み合わせが見つかりませんでした。`);
                    return;
                }
            }

            const currentNumber = resultFactors.reduce((a, b) => a * b, 1);
            currentTargetRaw = currentNumber.toString();
            currentTargetLatex = currentNumber.toString();
            
            const counts = {};
            resultFactors.forEach(f => counts[f] = (counts[f] || 0) + 1);
            const sortedPrimes = Object.keys(counts).map(Number).sort((a, b) => a - b);
            const parts = sortedPrimes.map(p => counts[p] > 1 ? `${p}^{${counts[p]}}` : `${p}`);
            
            currentAnswerLatex = parts.join(' \\times ');
            currentReadAloudText = `問題。${currentNumber}。`;
            
            renderDisplay();
        }

        // --- 共通描画処理 ---
        function renderDisplay() {
            const containerTarget = document.getElementById('targetNumber');
            const containerAns = document.getElementById('factorResult');
            const fsAnswer = document.getElementById('fullscreenAnswer');
            
            if (currentTargetRaw.length > 25) {
                containerTarget.className = "text-2xl md:text-3xl font-light tracking-tight text-[#2c2c2c] break-all pt-2 leading-tight py-4";
            } else if (currentTargetRaw.length > 15) {
                containerTarget.className = "text-3xl md:text-4xl font-light tracking-tight text-[#2c2c2c] break-all pt-2 leading-tight py-4";
            } else if (currentTargetRaw.length > 8) {
                containerTarget.className = "text-4xl md:text-5xl font-light tracking-tight text-[#2c2c2c] break-all pt-2 leading-tight py-4";
            } else {
                containerTarget.className = "text-5xl md:text-7xl font-light tracking-tight text-[#2c2c2c] break-all pt-2 leading-tight py-4";
            }

            if (window.katex) {
                katex.render(currentTargetLatex, containerTarget, { throwOnError: false, displayMode: true });
                katex.render(currentAnswerLatex, containerAns, { throwOnError: false, displayMode: true });
                katex.render(currentAnswerLatex, fsAnswer, { throwOnError: false, displayMode: true });
            } else {
                containerTarget.innerText = currentTargetRaw;
                containerAns.innerText = currentAnswerLatex;
                fsAnswer.innerText = currentAnswerLatex;
            }
            
            document.getElementById('resultArea').classList.remove('hidden');
        }

        function speakNumber() {
            const button = document.getElementById('ttsButton');
            const originalContent = button.innerHTML;
            button.disabled = true;
            button.classList.add('opacity-50', 'cursor-not-allowed');

            if (!('speechSynthesis' in window)) {
                alert('お使いのブラウザは音声読み上げに対応していません。');
                button.disabled = false;
                button.classList.remove('opacity-50', 'cursor-not-allowed');
                return;
            }

            const utterance = new SpeechSynthesisUtterance(currentReadAloudText);
            utterance.lang = 'ja-JP';

            utterance.onend = () => {
                button.disabled = false;
                button.classList.remove('opacity-50', 'cursor-not-allowed');
                button.innerHTML = originalContent;
            };

            utterance.onerror = (event) => {
                console.error('SpeechSynthesis error', event);
                button.disabled = false;
                button.classList.remove('opacity-50', 'cursor-not-allowed');
                button.innerHTML = `<span class="text-[#d32f2f]">エラー</span>`;
                setTimeout(() => { button.innerHTML = originalContent; }, 2000);
            };

            window.speechSynthesis.speak(utterance);
        }

        function toggleFullscreen() {
            const overlay = document.getElementById('fullscreenOverlay');
            const fsNumber = document.getElementById('fullscreenNumber');
            const fsAnswer = document.getElementById('fullscreenAnswer');
            
            if (overlay.classList.contains('hidden')) {
                if (!currentTargetRaw) return;
                
                if (window.katex) {
                    katex.render(currentTargetLatex, fsNumber, { throwOnError: false, displayMode: true });
                } else {
                    fsNumber.innerText = currentTargetRaw;
                }
                
                const len = currentTargetRaw.length;
                let fontSizeVw = Math.min(35, 120 / len);
                
                if (currentMode === 'polynomial' || currentMode === 'make10' || len > 10) {
                    fontSizeVw = Math.max(4, Math.min(20, 100 / len));
                }
                
                fsNumber.style.fontSize = `${fontSizeVw}vw`;
                
                fsAnswer.classList.add('hidden');
                fsAnswer.classList.remove('opacity-100');
                fsAnswer.classList.add('opacity-0');
                
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
            }
        }

        document.addEventListener('keydown', (e) => {
            const activeTag = document.activeElement.tagName;
            if (activeTag === 'INPUT' || activeTag === 'SELECT' || activeTag === 'TEXTAREA') return;

            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                undoScoreAction();
                return;
            }

            const overlay = document.getElementById('fullscreenOverlay');
            const isOverlayVisible = !overlay.classList.contains('hidden');

            if (e.code === 'Space') {
                e.preventDefault(); 
                const resultVisible = !document.getElementById('resultArea').classList.contains('hidden');
                if (resultVisible || isOverlayVisible) {
                    toggleFullscreen();
                }
            } else if (e.code === 'Enter' && isOverlayVisible) {
                e.preventDefault();
                const fsAnswer = document.getElementById('fullscreenAnswer');
                if (fsAnswer.classList.contains('hidden')) {
                    fsAnswer.classList.remove('hidden');
                    setTimeout(() => {
                        fsAnswer.classList.remove('opacity-0');
                        fsAnswer.classList.add('opacity-100');
                    }, 50);
                }
            }
        });

        document.getElementById('fullscreenOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'fullscreenOverlay') {
                toggleFullscreen();
            }
        });
    </script>
